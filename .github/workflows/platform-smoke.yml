      - name: Verify evidence-commit fixture bytes in verify mode
        if: ${{ inputs.mode == 'verify' }}
        env:
          RD0873_PRODUCER_ROOT: ${{ github.workspace }}/producer
          RD0873_EVIDENCE_ROOT: ${{ github.workspace }}/evidence
        run: >-
          node --input-type=module -e 'import{lstatSync,readFileSync}from"node:fs";import{join}from"node:path";import{spawnSync}from"node:child_process";const git=(cwd,args)=>{const r=spawnSync("git",args,{cwd,encoding:"buffer",windowsHide:true,maxBuffer:1048576});if(r.error||r.status!==0)throw 0;return r.stdout};try{const e=process.env.RD0873_EVIDENCE_ROOT,commit=process.env.RD0873_EVIDENCE_COMMIT,receiptPath=join(process.env.RD0873_RECEIPT_ROOT,"receipt.json"),gitText=(args)=>git(e,args).toString("utf8").trim(),head=gitText(["rev-parse","HEAD"]),parents=gitText(["rev-list","--parents","-n","1","HEAD"]).split(" "),paths=gitText(["diff-tree","--no-commit-id","--name-only","-r","HEAD"]).split("\n").filter(Boolean).sort(),workflow=git(e,["show","HEAD:.github/workflows/platform-smoke.yml"]);if(head!==commit||parents.length!==2||parents[1]!==process.env.RD0873_PRODUCER_COMMIT||gitText(["status","--porcelain=v1"])!==""||paths.join("\0")!==["scripts/tests/fixtures/rd0873-task6-producer-linux-x64.v1.json","scripts/tests/fixtures/rd0873-task6-producer-windows-x64.v1.json"].join("\0")||!workflow.equals(readFileSync(join(process.env.RD0873_PRODUCER_ROOT,".github","workflows","platform-smoke.yml"))))throw 0;const receiptStat=lstatSync(receiptPath);if(!receiptStat.isFile()||receiptStat.isSymbolicLink()||receiptStat.size<1||receiptStat.size>1048576)throw 0;const receiptBytes=readFileSync(receiptPath),fixtureName=process.env.RD0873_RECEIPT_PLATFORM==="win32"?"rd0873-task6-producer-windows-x64.v1.json":process.env.RD0873_RECEIPT_PLATFORM==="linux"?"rd0873-task6-producer-linux-x64.v1.json":"",fixturePath=join(e,"scripts","tests","fixtures",fixtureName),fixtureStat=lstatSync(fixturePath);if(!fixtureName||!fixtureStat.isFile()||fixtureStat.isSymbolicLink()||fixtureStat.size<1||fixtureStat.size>1048576)throw 0;const fixtureBytes=readFileSync(fixturePath);if(!fixtureBytes.equals(receiptBytes))throw 0}catch{process.exit(2)}'
      - name: Delete private reciprocal download inputs
        if: ${{ always() }}
        run: >-
          node --input-type=module -e 'import{existsSync,lstatSync,realpathSync,rmSync}from"node:fs";try{for(const root of [process.env.RD0873_PAYLOAD_ROOT,process.env.RD0873_RECEIPT_ROOT]){if(!root||!existsSync(root))continue;const stat=lstatSync(root);if(!stat.isDirectory()||stat.isSymbolicLink()||realpathSync.native(root)!==root)throw 0;rmSync(root,{recursive:true,force:false});if(existsSync(root))throw 0}}catch{process.exit(2)}'

  hosted-platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022 hosted proxy
            runner: windows-2022
            expected_os: windows-server-2022
          - name: macOS 14 arm64
            runner: macos-14
            expected_os: macos
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            expected_os: ubuntu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - name: Install the pinned compiler floor
        run: npm ci --prefix packages-ts/galerina-core-compiler
      - name: Prove platform-smoke refusal contracts
        run: node --test scripts/tests/platform-smoke.test.mjs
      - name: Prove Corpus runtime Node 20 compatibility
        run: node --test --test-name-pattern="Corpus runtime protection remains importable" scripts/tests/fungi-corpus-shard-execution.test.mjs
      - name: Run hermetic platform smoke
        run: node scripts/platform-smoke.mjs --json --expect-os ${{ matrix.expected_os }} > functional-${{ matrix.expected_os }}.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
      - name: Prove Corpus runtime Node 18 compatibility
        run: node --test --test-name-pattern="Corpus runtime protection remains importable" scripts/tests/fungi-corpus-shard-execution.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-${{ matrix.expected_os }}
          path: functional-${{ matrix.expected_os }}.json
          if-no-files-found: error

  official-linux-containers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12.15 x64
            image: debian:12.15-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
            expected_os: debian
          - name: Fedora 43 x64
            image: fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222
            expected_os: fedora
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - name: Install the pinned compiler floor
        run: npm ci --prefix packages-ts/galerina-core-compiler
      - name: Prove platform-smoke refusal contracts
        run: node --test scripts/tests/platform-smoke.test.mjs
      - name: Run hermetic platform smoke
        run: node scripts/platform-smoke.mjs --json --expect-os ${{ matrix.expected_os }} > functional-${{ matrix.expected_os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-${{ matrix.expected_os }}
          path: functional-${{ matrix.expected_os }}.json
          if-no-files-found: error

  # GitHub-hosted Windows is Windows Server, not Windows 11. This job stays
  # visibly skipped until the owner supplies a runner with the exact labels.
  windows-11-self-hosted:
    if: ${{ vars.GALERINA_WINDOWS11_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Windows, X64, windows-11]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os windows-11 > functional-windows-11.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-windows-11
          path: functional-windows-11.json
          if-no-files-found: error

  windows-10-self-hosted:
    if: ${{ vars.GALERINA_WINDOWS10_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Windows, X64, windows-10]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os windows-10 > functional-windows-10.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-windows-10
          path: functional-windows-10.json
          if-no-files-found: error

  # No third-party Mint container is trusted as release evidence. An actual
  # Linux Mint 22 runner can opt in without weakening that supply-chain rule.
  linux-mint-22-self-hosted:
    if: ${{ vars.GALERINA_MINT22_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Linux, X64, linux-mint-22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os linuxmint > functional-linuxmint.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-linuxmint
          path: functional-linuxmint.json
          if-no-files-found: error
